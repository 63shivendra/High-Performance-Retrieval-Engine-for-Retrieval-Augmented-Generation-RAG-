name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - name: Install
        run: |
          pip install -r requirements-app.txt pytest httpx
          python -m nltk.downloader stopwords punkt punkt_tab
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t selfindex .
      - name: Smoke test
        run: |
          docker run -d -p 7860:7860 --name app selfindex
          for i in $(seq 1 60); do curl -sf localhost:7860/healthz && break; sleep 2; done
          curl -sf "localhost:7860/api/search?q=quantum+physics&model=tfidf" | grep -q '"results"'
